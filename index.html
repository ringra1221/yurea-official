<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- web setting -->
    <title>ゆれあ 公式サイト | ゆれあ (Yurea)</title>
    <meta name="description" content="美少女ゲームブランド ゆれあ（Yurea）の公式サイトです。">
    <link rel="icon" href="https://raw.githubusercontent.com/ringra1221/yurea-official/refs/heads/main/page/images/yurea-icon.png" type="image/png">
    <script src="https://raw.githubusercontent.com/ringra1221/yurea-official/refs/heads/main/common/header.js" defer></script>


    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Splide CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css"
    >

    <!-- Splide JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"
        defer
    ></script>

    <!-- JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- ヘッダー -->
    <div id="site-header"></div>    
    
    <!-- メインコンテンツ -->
    <main class="content">

        <!-- メインビジュアルスライダー -->
        <section
            id="main-slider"
            class="splide"
            aria-label="ゆれあ メインビジュアル"
        >

            <div class="splide__track">

                <ul class="splide__list">

                    <!-- スライド1 -->
                    <li class="splide__slide">
                        <img
                            data-splide-lazy="https://shopping.c.yimg.jp/lib/fi-mint/a1-grc120dskna.jpg"
                            alt="ゆれあ メインビジュアル1"
                        >
                    </li>

                    <!-- スライド2 -->
                    <li class="splide__slide">
                        <img
                            data-splide-lazy="https://www.air-r.jp/item/images/10/s0t-kago1-desk.jpg"
                            alt="ゆれあ メインビジュアル2"
                        >
                    </li>

                    <!-- スライド3 -->
                    <li class="splide__slide">
                        <img
                            data-splide-lazy="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkB6S4ZpOxtGNlSoYuoxIoNwNR7jHBcWyeqQdHOW_jIW0FJr4z-nxOCFPE&s=10"
                            alt="ゆれあ メインビジュアル3"
                        >
                    </li>

                </ul>

            </div>

        </section>

        <!-- 通常コンテンツ -->
        <section class="main-content" id="works">

            <h1>準備中です。</h1>

            <p>独自エンジン開発中</p>

        </section>

        <!-- お問い合わせ -->
        <section class="contact-content" id="contact">

            <h2>お問い合わせ</h2>

            <p>お問い合わせページは準備中です。</p>

        </section>

    </main>

</body>
</html>
